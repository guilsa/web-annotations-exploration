<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body { position: relative; }
  textarea {
    display: block; width: 100%; height: 100%; margin: 0; resize: none;
    padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px;
    background: #fff; color: #111827; font: 12.5px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    outline: none;
  }
  textarea:focus { border-color: #3b82f6; box-shadow: 0 0 0 1px #3b82f6; }
  textarea.code { font: 11px/1.35 ui-monospace, SFMono-Regular, Consolas, monospace; word-break: break-all; }
  .focus-sentinel {
    position: fixed; width: 1px; height: 1px; padding: 0; border: 0;
    opacity: 0; pointer-events: none; clip-path: inset(50%);
  }
</style>
</head>
<body>
<button class="focus-sentinel before" type="button" aria-hidden="true" tabindex="0"></button>
<textarea aria-label="Pairshare text editor" disabled></textarea>
<button class="focus-sentinel after" type="button" aria-hidden="true" tabindex="0"></button>
<script src="editor.js"></script>
</body>
</html>
