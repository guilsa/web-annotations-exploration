<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pairshare</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    width: 250px; margin: 0; padding: 10px;
    background: Canvas; color: CanvasText;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { margin: 0 0 8px; padding: 0 4px; font-size: 14px; }
  button, label {
    display: block; width: 100%; padding: 8px 10px; border: 0;
    border-radius: 6px; background: transparent; color: inherit;
    font: inherit; text-align: left; cursor: pointer;
  }
  button:hover, label:hover { background: color-mix(in srgb, CanvasText 10%, Canvas); }
  .separator { height: 1px; margin: 5px 6px; background: color-mix(in srgb, CanvasText 18%, Canvas); }
  input { display: none; }
  #status { display: none; margin: 7px 4px 0; color: GrayText; font-size: 11px; }
  #status.error { display: block; color: #b91c1c; }
  @media (prefers-color-scheme: dark) { #status.error { color: #fca5a5; } }
</style>
</head>
<body>
  <h1>Pairshare</h1>
  <button type="button" data-action="comments">Open comments &amp; suggestions</button>
  <button type="button" data-action="pair">Pair with another browser</button>
  <div class="separator" role="separator"></div>
  <label for="backup">Import backup…</label>
  <input id="backup" type="file" accept="application/json,.json">
  <p id="status" role="status"></p>
  <script src="popup.js"></script>
</body>
</html>
